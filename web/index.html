<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Budget</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header class="head">
        <div>
          <h1>Claude budget</h1>
          <p class="sub" id="window-label">—</p>
        </div>
        <button id="refresh" class="ghost" type="button">Rescan</button>
      </header>

      <section class="hero">
        <div class="gauge">
          <div class="gauge-label">Today's allowance</div>
          <div class="gauge-value"><span id="today-spent">—</span><span class="of" id="today-allow"></span></div>
          <div class="meter"><div class="meter-fill" id="today-meter"></div></div>
          <div class="verdict" id="verdict">—</div>
        </div>

        <dl class="stats">
          <div><dt>Week spent</dt><dd id="week-spent">—</dd></div>
          <div><dt>Week remaining</dt><dd id="week-remaining">—</dd></div>
          <div><dt>Last 5 hours</dt><dd id="block-spent">—</dd></div>
          <div><dt>Capacity basis</dt><dd id="capacity-source" class="small">—</dd></div>
        </dl>
      </section>

      <section class="planner">
        <div class="planner-head">
          <h2>Coding availability</h2>
          <p class="sub">Drag a column up or down to change how much of the week's budget that day gets. Away days hand their share to the rest.</p>
        </div>
        <div class="week" id="week"></div>
        <div class="legend">
          <span><i class="swatch planned"></i> allocated</span>
          <span><i class="swatch spent"></i> actually used</span>
          <span><i class="swatch over"></i> over allocation</span>
        </div>
      </section>

      <section class="settings">
        <label>
          Week resets
          <select id="week-dow">
            <option value="0">Sunday</option>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
          </select>
          at
          <input id="week-hour" type="number" min="0" max="23" step="1" />:00
        </label>
        <label>
          Weekly capacity
          <select id="cap-mode">
            <option value="auto">Infer from my history</option>
            <option value="manual">Set manually</option>
          </select>
          <input id="cap-value" type="number" min="0" step="1" placeholder="weighted $" />
        </label>
      </section>

      <p class="footnote" id="footnote"></p>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
